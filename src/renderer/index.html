<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>vsorch</title>
  </head>
  <body>
    <div id="topbar">
      <span id="title">vsorch</span>
      <div id="topbar-actions">
        <div id="remotes-wrap">
          <button id="remotes-btn" title="Remote hosts" disabled>&#x2601;</button>
          <div id="remotes-menu" class="hidden">
            <div id="remotes-empty">no remotes configured</div>
          </div>
        </div>
        <div id="layout-wrap">
          <button id="layout-btn" title="Pane layout" disabled>⊞</button>
          <div id="layout-menu" class="hidden">
            <button data-layout="row">◫ One row</button>
            <button data-layout="column">⊟ One column</button>
            <button data-layout="grid">⊞ Grid</button>
          </div>
        </div>
        <button id="add-pane" title="Add local pane" disabled>+</button>
      </div>
    </div>
    <div id="warning-banner" class="hidden">
      <span id="warning-text"></span>
      <button id="warning-dismiss" title="Dismiss">&times;</button>
    </div>
    <div id="panes">
      <div id="status">starting VS Code…</div>
    </div>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
